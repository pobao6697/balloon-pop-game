<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balloon Pop Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-wrap">
      <h1>풍선 터뜨리기</h1>
      <div class="hud">
        <div class="timer-box">남은 시간: <span id="timeLeft">10</span>초</div>
        <div class="status-box">남은 풍선: <span id="balloonLeft">9</span></div>
      </div>
      <div id="gameArea" class="game-area" aria-label="게임 화면"></div>
      <div id="message" class="message hidden">오빠 사랑해</div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
