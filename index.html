<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>풍선 터뜨리기</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="park-scene">
      <div class="sun"></div>
      <div class="cloud cloud-one"></div>
      <div class="cloud cloud-two"></div>
      <div class="cloud cloud-three"></div>

      <div class="game-panel">
        <div class="title-wrap">
          <h1>풍선 터뜨리기</h1>
        </div>

        <div id="startScreen" class="start-screen">
          <button id="startBtn" class="start-btn" type="button">
            <span>쟈끼이~!!</span>
            <span>게임시작!!</span>
          </button>
        </div>

        <div id="hud" class="hud hidden">
          <div class="info-box">
            <span>남은 시간</span>
            <strong id="timeLeft">10</strong>
          </div>
          <div class="info-box">
            <span>점수</span>
            <strong id="score">0</strong>
          </div>
        </div>

        <div id="gameArea" class="game-area hidden" aria-live="polite"></div>

        <div id="floatingMessage" class="floating-message" aria-live="assertive"></div>
        <div id="finalMessage" class="final-message hidden" aria-live="polite"></div>

        <button id="restartBtn" class="restart-btn hidden" type="button">다시 하기</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
